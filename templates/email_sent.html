
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | B&W Media Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">B&W<span>.</span></div>
        <nav>EMAIL STATUS</nav>
    </header>

    <main>
        <p class="eyebrow">B&W MEDIA CONVERTER</p>
        <h1>Email <span>sent!</span></h1>

        <section class="converter">
            <div class="upload-area">
                <p>
                    Your file <strong>{{ filename }}</strong> was emailed to
                    <strong>{{ recipient }}</strong>.
                </p>
                <p>Please check the recipient's inbox and spam folder.</p>
                <p>
                    <a href="{{ url_for('home') }}">Convert another file</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
